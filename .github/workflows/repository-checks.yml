name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  authored-checks:
    name: Publication guards and synthetic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check tracked files and complete history
        run: python scripts/check_public_repo.py
      - name: Run authored synthetic tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check the asset-free host simulation clock
        run: |
          c++ -std=c++17 -Wall -Wextra -Werror tests/simulation_clock.cpp -o /tmp/fs15-simulation-clock
          /tmp/fs15-simulation-clock
      - name: Install Linux script/XML development dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libluajit-5.1-dev libexpat1-dev pkg-config libsdl2-dev libsdl2-image-dev libgl-dev libgl1-mesa-dri xvfb xauth
      - name: Build and test recovered portable components without Windows or original resources
        run: |
          cmake -S . -B build/ci-portable-core -DFS15_PORTABLE_CORE_ONLY=ON -DFS15_BUILD_PORTABLE_HOST=ON -DFS15_BUILD_PORTABLE_SCRIPTS=ON -DFS15_BUILD_LINUX_MENU=ON -DFS15_BUILD_GL_CHECK=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build/ci-portable-core --parallel 2
          ctest --test-dir build/ci-portable-core --output-on-failure
      - name: Check recovered buffers on actual Linux OpenGL (Mesa software rasterizer)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a build/ci-portable-core/src/core/FS15GLDriverCheck
      - name: Install and exercise Linux x64 hosts and SDL frontend transport
        run: |
          cmake --install build/ci-portable-core --prefix build/linux-portable-host
          python tests/check_portable_host.py --exe build/linux-portable-host/bin/FS15PortableHost --workdir build/linux-host-integration --report build/linux-host-validation.json
          build/ci-portable-core/src/portable/FS15PortableMetadataCheck build/linux-script-metadata
          python tests/check_script_host.py --exe build/linux-portable-host/bin/FS15ScriptHost --workdir build/linux-script-integration --report build/linux-script-host-validation.json
          python tests/check_linux_menu.py --exe build/linux-portable-host/bin/FS15MenuLinux --workdir build/linux-menu-integration --report build/linux-menu-validation.json
          ldd build/linux-portable-host/bin/FS15PortableHost > build/linux-portable-host/share/fs15-reconstruction/runtime-dependencies.txt
          ldd build/linux-portable-host/bin/FS15ScriptHost >> build/linux-portable-host/share/fs15-reconstruction/runtime-dependencies.txt
          ldd build/linux-portable-host/bin/FS15MenuLinux >> build/linux-portable-host/share/fs15-reconstruction/runtime-dependencies.txt
          tar -C build/linux-portable-host -czf build/fs15-linux-x64-portable-host.tar.gz .
          cd build
          sha256sum fs15-linux-x64-portable-host.tar.gz > fs15-linux-x64-portable-host.sha256
      - name: Upload the authored Linux portability host
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fs15-linux-x64-portable-host
          path: |
            build/fs15-linux-x64-portable-host.tar.gz
            build/fs15-linux-x64-portable-host.sha256
            build/linux-host-validation.json
            build/linux-script-host-validation.json
            build/linux-menu-validation.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  portable-arm64-checks:
    name: Recovered core on emulated ARM64 Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the cross-compiler and user-mode CPU emulator
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends g++-aarch64-linux-gnu qemu-user
      - name: Cross-compile and execute asset-free recovered-core checks
        run: |
          cmake -S . -B build/ci-arm64-core -DFS15_PORTABLE_CORE_ONLY=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=cmake/aarch64-linux-gnu.cmake
          cmake --build build/ci-arm64-core --parallel 2
          ctest --test-dir build/ci-arm64-core --output-on-failure
