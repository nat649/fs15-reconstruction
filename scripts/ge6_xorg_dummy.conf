# Authored virtual test monitor: RandR reports this configured 60 Hz mode.
# This is a software display, not a physical GPU/monitor claim.
Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoAddGPU" "false"
    Option "DontVTSwitch" "true"
EndSection
Section "Device"
    Identifier "GE6Virtual"
    Driver "dummy"
    VideoRam 256000
EndSection
Section "Monitor"
    Identifier "GE6Monitor"
    HorizSync 30-90
    VertRefresh 50-75
    Modeline "1280x720_60" 74.25 1280 1390 1430 1650 720 725 730 750 +HSync +VSync
EndSection
Section "Screen"
    Identifier "GE6Screen"
    Device "GE6Virtual"
    Monitor "GE6Monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1280x720_60"
        Virtual 1280 720
    EndSubSection
EndSection
Section "ServerLayout"
    Identifier "GE6Layout"
    Screen "GE6Screen"
EndSection
